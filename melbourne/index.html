<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0d10">
<title>Melbourne Team Lead Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: freight-manifest console — header band, figure strip, weekly chart + quick lists, then the roster as a filterable manifest of codes. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F7F8F9; --ink:#14161B; --ink-2:#434A57; --muted:#687080;
  --line:#E1E4E9; --grid:#ECEEF1; --accent:#D63A25; --accent-ink:#FFFFFF; --accent-soft:#FCE8E4;
  --good:#17714B; --good-bg:#E1F3EA; --warn:#8A5A00; --warn-bg:#FBEFD2; --quiet:#566070; --quiet-bg:#E9ECF0;
  --focus:#2563EB; --hazard:#F2B705; --shadow:0 1px 2px rgba(20,22,27,.06);
  --f-display:"Big Shoulders Display","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --ink-2:#C2C7D1; --muted:#9298A6;
  --line:#2A2F39; --grid:#232831; --accent:#FF6450; --accent-ink:#1B0906; --accent-soft:#3B1A14;
  --good:#63D29F; --good-bg:#11301F; --warn:#F0C14B; --warn-bg:#3A2D0C; --quiet:#AAB1BE; --quiet-bg:#262B34;
  --focus:#7EA8FF; --hazard:#F2B705; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --ink-2:#C2C7D1; --muted:#9298A6;
  --line:#2A2F39; --grid:#232831; --accent:#FF6450; --accent-ink:#1B0906; --accent-soft:#3B1A14;
  --good:#63D29F; --good-bg:#11301F; --warn:#F0C14B; --warn-bg:#3A2D0C; --quiet:#AAB1BE; --quiet-bg:#262B34;
  --focus:#7EA8FF; --hazard:#F2B705; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.placard{width:44px;height:44px;flex:none;transform:rotate(45deg);background:var(--hazard);border:2px solid var(--ink);display:grid;place-items:center;border-radius:3px}
.placard span{transform:rotate(-45deg);font:800 15px/1 var(--f-display);color:#14161B;letter-spacing:.02em}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(28px,4.2vw,40px)/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.fresh{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:440px}
.fresh b{font-weight:600;color:var(--ink)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.stat .value{font-size:24px}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;box-shadow:var(--shadow)}
.stat .label{font-size:12.5px;color:var(--ink-2)}
.stat .value{font:600 28px/1.1 var(--f-body)}
.stat .sub{font-size:12px;color:var(--muted)}

/* overview */
.overview{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.overview{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font:600 15px/1.3 var(--f-body)}
.panel .hint{font-size:12px;color:var(--muted);margin-top:2px}

.chartp{display:flex;flex-direction:column}
.chart{position:relative;margin-top:14px;flex:1;min-height:190px;display:grid;grid-template-columns:28px 1fr;gap:6px}
.yaxis{position:relative;font-size:11px;color:var(--muted)}
.yaxis span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;border-bottom:1px solid var(--line)}
.gline{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;outline:none;cursor:default}
.bar{width:100%;max-width:24px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.col.partial .bar{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.col .val{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:3px}
.col .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3}
.col:hover .tip,.col:focus-visible .tip{opacity:1}
.col:nth-last-child(-n+4) .tip{left:auto;right:0;transform:none}
.col:nth-child(-n+2) .tip{left:0;transform:none}
.col:hover .bar,.col:focus-visible .bar{filter:brightness(1.12)}
.xlabels{display:flex;gap:2px;margin-left:34px;margin-top:6px}
.xlabels span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:visible}
@media (max-width:620px){.xlabels span:not(:nth-child(3n+1)){visibility:hidden}}

.quick{display:grid;gap:8px;margin-top:12px}
.qbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.qbtn:hover{border-color:var(--ink-2)}
.qbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.qbtn .qt{font-weight:600;font-size:13.5px}
.qbtn .qd{font-size:12px;color:var(--muted)}
.qbtn .qn{font:600 18px/1 var(--f-body);font-variant-numeric:tabular-nums}

/* roster toolbar */
.roster{display:grid;gap:10px}
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{display:grid;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;min-width:0;text-transform:none;letter-spacing:0;color:var(--ink)}
.filters input[type=search]{width:min(260px,100%)}
.showing{font-size:12.5px;color:var(--muted)}
.clear{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px 0;font-size:12.5px}

/* rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.row,.lhead{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.05fr) minmax(0,1.7fr) minmax(0,1.35fr) 34px;gap:14px;align-items:start;padding:12px 14px}
.lhead{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-block:9px}
.row{border-bottom:1px solid var(--line)}
.item:last-child .row{border-bottom:0}
.item.open .row{background:var(--surface-2)}
.code{font:700 13.5px/1.2 var(--f-mono);letter-spacing:.02em;word-break:break-all}
.nm{font-size:13px;color:var(--ink-2);margin-top:2px}
.nm.none{color:var(--muted);font-style:italic}
.ig{font-size:12.5px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);word-break:break-all}
.ig:hover{color:var(--accent);border-color:var(--accent)}
.flag{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 6px}
.tix{display:flex;align-items:center;gap:10px}
.tix .num{font:600 20px/1 var(--f-body);font-variant-numeric:tabular-nums;min-width:2ch}
.tix .num.zero{color:var(--muted);font-weight:500}
.tix .rk{font-size:11.5px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:1px;height:20px;width:66px}
.spark i{flex:1;background:var(--accent);border-radius:1.5px 1.5px 0 0;min-height:1px;opacity:.9}
.spark i.z{background:var(--line);opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-active{color:var(--good);background:var(--good-bg)}
.s-slowing{color:var(--warn);background:var(--warn-bg)}
.s-quiet{color:var(--quiet);background:var(--quiet-bg)}
.s-none{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.s-none::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.when{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.contact{display:grid;gap:5px;min-width:0}
.cline{display:flex;align-items:center;gap:6px;min-width:0}
.cline .v{font-size:13px;min-width:0;overflow-wrap:anywhere;user-select:all}
.cline .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:40px;flex:none}
.copy{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11.5px;padding:2px 7px;cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--ink-2);color:var(--ink)}
.nocontact{font-size:12.5px;color:var(--muted)}
.out{display:grid;gap:5px;min-width:0}
.out select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px}
.out select.set{border-color:var(--ink-2);font-weight:600}
.out .by{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.out .note-ex{font-size:12px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.more svg{transition:transform .15s}
.item.open .more svg{transform:rotate(180deg)}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;padding:4px 14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.detail h3{font:600 12px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.wk{display:flex;align-items:flex-end;gap:2px;height:60px;border-bottom:1px solid var(--line)}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.wk b{width:100%;max-width:16px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.wk b.z{background:transparent}
.wk .partial b{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.wk em{font-style:normal;font-size:10px;color:var(--ink-2);font-weight:600}
.wkx{display:flex;gap:2px;margin-top:4px}
.wkx span{flex:1;text-align:center;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-top:12px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere;color:var(--ink-2)}
.notes-list{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--warn)}
.note-box{display:grid;gap:6px}
.note-box textarea{width:100%;min-height:74px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:7px;padding:7px 14px;cursor:pointer;justify-self:start}
.btn:disabled{opacity:.5;cursor:default}
.ro{font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .lhead{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who more" "tix tix" "st st" "ct ct" "out out";gap:10px}
  .row>.c-who{grid-area:who}.row>.c-tix{grid-area:tix}.row>.c-st{grid-area:st}.row>.c-ct{grid-area:ct}.row>.c-out{grid-area:out}.row>.c-more{grid-area:more}
  .c-st{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.c-st .when{margin-top:0}
  .nosale .c-tix{display:none}
}

/* checks */
.checks ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.checks .code{font-size:12.5px}
.foot{font-size:12px;color:var(--muted);display:grid;gap:4px;max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;z-index:10;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.lock{display:grid;gap:10px}
.lk-row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lk-row>div:first-child{flex:1 1 320px;min-width:0}
.lock h2{font-size:16px}
.lk-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lk-form input[type=password]{min-width:0;width:260px;max-width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-mono)}
.lk-form .rem{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lk-msg{color:var(--accent);font-weight:600;font-size:13px}
.lock.open{border-left:4px solid var(--good)}
.lock:not(.open){border-left:4px solid var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qbtn[disabled]{opacity:.55;cursor:not-allowed}
select:disabled{opacity:.55}
@media (max-width:620px){.lk-form{width:100%}.lk-form input[type=password]{flex:1 1 100%;width:100%}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,700..900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Sales Desk look: always dark, city poster colour. Triple :root beats the light/dark token blocks above. */
:root:root:root{color-scheme:dark;
  --bg:#0e0d10; --surface:#18161b; --surface-2:#1f1d23; --ink:#f5f2f7; --ink-2:#cdc7d2; --muted:#9a93a1;
  --line:#2e2a33; --grid:#25222a; --good:#5cc98a; --good-bg:#16301f; --warn:#e8b44f; --warn-bg:#352812;
  --quiet:#b3acb9; --quiet-bg:#2a2730; --focus:#8ab4ff; --shadow:none;
  --accent:#a978ff; --accent-ink:#120f14; --accent-soft:#2e1d4a; --glow:rgba(150,95,240,.40); --hazard:#a978ff;
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif}
body{background:radial-gradient(900px 460px at 12% -120px,var(--glow),transparent 72%) no-repeat,var(--bg);color:var(--ink);font-size:15px}
h1{font-stretch:112%;font-weight:900;font-size:clamp(24px,4vw,38px);line-height:1.02}
.eyebrow{font-family:var(--f-cond);font-size:13px;letter-spacing:.14em;color:var(--ink-2)}
.top{padding-bottom:14px;border-bottom:2px solid var(--accent)}
.placard{background:var(--accent);border-color:#120f14}
.placard span{color:#120f14;font-family:var(--f-cond);font-weight:700;font-size:16px}
.panel h2{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.01em}
.stat .label,.lhead,.filters label,.detail h3{font-family:var(--f-cond);letter-spacing:.08em}
.code{font-family:var(--f-cond);font-weight:700;letter-spacing:.03em}
input,select,textarea{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
</style>
<style>
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:860px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs .tab:first-child{grid-column:1/-1}}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;padding:11px 14px;text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start;min-width:0;font:inherit}
.tab .tl{font:700 15px/1.1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase}
.tab .tn{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab:hover{border-color:var(--accent);color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .tn{color:var(--accent-ink);opacity:.8}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.tcard{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:14px;text-align:left;color:var(--ink);cursor:pointer;display:grid;gap:9px;font:inherit;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tcard[disabled]{cursor:default}
.tcard[disabled]:hover{border-color:var(--line)}
.tcard .tname{font:700 14px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tcard .tbig{font:800 30px/1 var(--f-display);font-stretch:112%;font-variant-numeric:tabular-nums}
.tcard .tbig small{font:500 13px var(--f-body);color:var(--muted);margin-left:6px;font-stretch:normal}
.tshare{height:6px;background:var(--grid);border-radius:99px;overflow:hidden}
.tshare i{display:block;height:100%;background:var(--accent)}
.tcard.none .tshare i{background:var(--quiet)}
.tmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.tmeta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tspark{display:flex;align-items:flex-end;gap:3px;height:34px}
.tspark i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.tspark i.z{background:var(--grid)}
.tspark i.cur{opacity:.55}
.tcard.none .tspark i:not(.z){background:var(--quiet)}
.tfoot{font-size:12.5px;font-weight:600;color:var(--accent)}
.tcard.none .tfoot{color:var(--muted)}

<style>
/* team lead to-do */
.todo{display:grid;gap:14px}
.todo[hidden]{display:none}
.todo .thead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between}
.todo .ttl{min-width:0;flex:1 1 300px}
.twk{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.twb{width:34px;height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.twb:hover:not(:disabled){border-color:var(--accent)}
.twb:disabled{opacity:.35;cursor:default}
.twl{display:grid;gap:2px;min-width:140px;text-align:center}
.twl b{font:700 14px/1.1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase}
.twl span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.twnow{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 2px}
.tnote{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px}
.tnote.quiet{color:var(--muted);background:var(--surface-2)}
.tprog{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"n seg left";gap:16px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.tpn{grid-area:n;display:flex;align-items:baseline;gap:6px}
.tpn b{font:800 30px/1 var(--f-display);font-stretch:112%;font-variant-numeric:tabular-nums}
.tpn span{font-size:13px;color:var(--muted);white-space:nowrap}
.tprog .tseg{grid-area:seg;height:12px}
.tleft{grid-area:left;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tprog.all .tleft{color:var(--good)}
@media (max-width:620px){.tprog{grid-template-columns:auto 1fr;grid-template-areas:"n left" "seg seg";gap:10px 12px}.tleft{text-align:right}}
.tseg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;height:8px}
.tseg i{background:var(--grid);border-radius:3px;box-shadow:inset 0 0 0 1px var(--line)}
.tseg i.on{background:var(--accent);box-shadow:none}
.tdays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:1100px){.tdays{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.tdays{grid-template-columns:minmax(0,1fr)}}
.tday{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.tday.st-today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tday header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tdl{font:700 16px/1.1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase}
.tdd{font-size:12px;color:var(--muted);margin-top:3px}
.tpill,.tmini{font:700 11px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 8px;white-space:nowrap;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.st-done>header .tpill,.tmini.st-done{color:var(--good);background:var(--good-bg);box-shadow:none}
.st-today>header .tpill,.tmini.st-today{color:var(--accent-ink);background:var(--accent);box-shadow:none}
.st-overdue>header .tpill,.st-missed>header .tpill,.tmini.st-overdue,.tmini.st-missed{color:var(--warn);background:var(--warn-bg);box-shadow:none}
.tbrief{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--line)}
.tbrief b{color:var(--ink);font-weight:600}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.titem{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:7px 6px;margin-inline:-6px;border-radius:7px}
.titem:hover{background:var(--surface)}
.titem input{appearance:none;-webkit-appearance:none;margin:0;width:22px;height:22px;border:2px solid var(--ink-2);border-radius:6px;background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .12s,border-color .12s}
.titem input::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg);opacity:0}
.titem input:checked{background:var(--accent);border-color:var(--accent)}
.titem input:checked::after{opacity:1}
.titem input:disabled{cursor:default;opacity:.5}
.titem label{cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.35;padding-top:1px;min-width:0;overflow-wrap:anywhere}
.titem.on .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.titem small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.tout{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:10px}
.tout b{color:var(--ink);font-variant-numeric:tabular-nums}
.tout span{min-width:0;flex:1 1 160px}
.tfield{display:grid;gap:5px;border-top:1px dashed var(--line);padding-top:10px}
.tfield label{font:600 12px/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.todo .tfield textarea{width:100%;min-height:70px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;color:var(--ink)}
.todo .tfield textarea:focus{border-color:var(--accent)}
.tsaved{font-size:11.5px;color:var(--muted);min-height:1em}
.tfn{font-size:12px;color:var(--muted)}
.tteams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ttcard{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:14px;text-align:left;color:var(--ink);cursor:pointer;display:grid;gap:10px;font:inherit;min-width:0}
.ttcard:hover{border-color:var(--accent)}
.ttcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ttn{font:700 14px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ttb{font:800 30px/1 var(--f-display);font-stretch:112%;font-variant-numeric:tabular-nums}
.ttb small{font:500 13px var(--f-body);color:var(--muted);margin-left:6px;font-stretch:normal}
.tminis{display:flex;gap:4px;flex-wrap:wrap}
.tmini{border-radius:4px;padding:4px 6px;font-size:10.5px}
.tnext{font-size:12.5px;color:var(--ink-2)}
</style>

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const dshort = s => { const d = pd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const dlong = s => { const d = pd(s); return `${DAY[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const daysBetween = (a,b) => Math.round((pd(b) - pd(a)) / 86400000);
const IGOK = h => /^[A-Za-z0-9._]{1,30}$/.test(h);
const plural = (n, w) => `${n} ${n === 1 ? w : (w === "person" ? "people" : w + "s")}`;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
const K_PASS = "dgtl-pass-" + KEY, K_OUT = "dgtl-out-" + KEY, K_TAB = "dgtl-tab-" + KEY;

function tabFromHash(){
  const m = location.hash.match(/^#team-([123])$/);
  if (m) return +m[1];
  if (location.hash === "#hosts") return HOST;
  if (location.hash === "#all") return 0;
  return null;
}

/* ---------- sales: the leaderboard's own data, read live from the same site ---------- */
function slim(d){
  return {
    generated: d.generated || "", today: d.today, alias: d.alias || {},
    weeks: (d.weeks || []).map(w => ({key:w.key, end:w.end, label:w.label})),
    promoters: (d.promoters || []).map(p => {
      const last = (p.sales || []).reduce((m,s) => (s[0] > m ? s[0] : m), "").slice(0,10);
      const cum = p.cum || []; const total = cum.length ? cum[cum.length-1] : (p.weekly||[]).reduce((a,b)=>a+b,0);
      return {code:p.code, weekly:p.weekly || [], total, last: last || p.last || ""};
    }),
  };
}
let LB = PUB.snapshot, lbLive = false;
async function loadLive(){
  try {
    const r = await fetch(PUB.lb_path, {cache:"no-store"});
    if (!r.ok) throw new Error("status " + r.status);
    const html = await r.text();
    const m = html.match(/<script id="pc-data" type="application\/json">([\s\S]*?)<\/script>/);
    if (!m) throw new Error("no data");
    LB = slim(JSON.parse(m[1])); lbLive = true;
  } catch (e) { lbLive = false; }
  compute(); render();
}

function save(code, patch){
  const cur = outreach[code] || {};
  const body = {status: patch.status ?? cur.status ?? "", note: patch.note ?? cur.note ?? "", at: new Date().toISOString()};
  if (!body.status && !body.note) delete outreach[code]; else outreach[code] = body;
  store.set(K_OUT, JSON.stringify(outreach));
  if ("note" in patch){ delete drafts[code]; toast("Note saved for " + code); }
  else toast(body.status ? `${code}: ${OUTL[body.status]}` : `${code}: cleared`);
  render();
}

/* ---------- merge ---------- */
let ALL = [], P = [], sold = [], nos = [], WEEKS = [], TEAM = [], REF = "", CUR = 0, LASTW = -1;
const open = new Set(), drafts = {};
let pendingRender = false;
const EMPTY = {name:"", ig:"", phone:"", email:"", contact_level:"None", contact_source:"", in_codes_sheet:true, notes:[], teams:null, team_status:{}};
function compute(){
  REF = LB.today;
  WEEKS = LB.weeks.map(w => w.key);
  CUR = WEEKS.findIndex(k => k >= REF); if (CUR < 0) CUR = WEEKS.length - 1;
  LASTW = CUR - 1;
  const byCode = {};
  LB.promoters.forEach(x => {
    byCode[x.code] = Object.assign({}, EMPTY, {code:x.code, weekly:WEEKS.map((_,i) => +x.weekly[i] || 0), tickets:+x.total || 0,
      last_sale:x.last, last_week: LASTW >= 0 ? (+x.weekly[LASTW] || 0) : 0, since_mon: +x.weekly[CUR] || 0, known:false});
  });
  if (ROSTER){
    const owned = new Set(ROSTER.map(r => r.code));
    ROSTER.forEach(r => {
      const al = LB.alias && LB.alias[r.code];
      const code = al && !owned.has(al) ? al : r.code;   // borrow the leaderboard code only if no other record owns it
      const b = byCode[code];
      const c = {name:r.name||"", ig:r.ig||"", phone:r.phone||"", email:r.email||"", contact_level:r.contact_level||"None",
                 contact_source:r.contact_source||"", in_codes_sheet:!!r.in_codes_sheet, notes:(r.notes||[]).slice(), known:true,
                 teams:(r.teams||[]).slice(), team_status:r.team_status||{}};
      if (al) c.notes.push(`Sales for ${r.code} are counted under ${al} on the leaderboard`);
      if (b) Object.assign(b, c);
      else byCode[r.code] = Object.assign({code:r.code, weekly:WEEKS.map(()=>0), tickets:0, last_sale:"", last_week:0, since_mon:0}, c);
    });
    Object.values(byCode).forEach(p => { if (!p.known){ p.in_codes_sheet = false; p.notes = [`On the sales leaderboard but NOT in the ${PUB.codes_sheet} sheet or any team sheet, so no contact details on file`]; } });
  }
  ALL = Object.values(byCode).map(p => {
    if (!p.teams) p.teams = (PUB.teams_pub[p.code] || []).slice();
    p.link = PUB.link_base + p.code;
    p.sold = p.tickets > 0;
    if (!p.sold) p.last_sale = "";
    const gap = p.last_sale ? daysBetween(p.last_sale, REF) : null;
    p.s = !p.sold ? "none" : gap <= 21 ? "active" : gap <= 42 ? "slowing" : "quiet";
    p.shownNotes = (p.notes||[]).filter(n => !/^Listed \d+x/.test(n));
    p.hay = [p.code,p.name,p.ig,(p.phone||"").replace(/\s/g,""),p.phone,p.email].join(" ").toLowerCase();
    return p;
  });
  const ranked = ALL.filter(p => p.sold).map(p => p.tickets);
  ALL.forEach(p => { p.rank = p.sold ? 1 + ranked.filter(t => t > p.tickets).length : null; });
  applyScope();
}
function scopeOf(t){ return t ? ALL.filter(p => p.teams.includes(t)) : ALL; }
function applyScope(){
  P = scopeOf(TAB);
  sold = P.filter(p => p.sold); nos = P.filter(p => !p.sold);
  const tr = sold.map(p => p.tickets);
  P.forEach(p => { p.trank = p.sold ? 1 + tr.filter(t => t > p.tickets).length : null; });
  TEAM = WEEKS.map((_,i) => sold.reduce((a,p) => a + p.weekly[i], 0));
}
const weekLabel = i => (LB.weeks[i] && LB.weeks[i].end) || dshort(WEEKS[i]);
function lastSaleText(p){ return p.last_sale ? "Last sale " + dlong(p.last_sale) : ""; }
const sum = (arr, f) => arr.reduce((a,p) => a + f(p), 0);
const teamCodes = t => ROSTER ? scopeOf(t).length : (t ? PUB.team_counts[t].codes : PUB.roster_count);
const teamNoSales = t => ROSTER ? scopeOf(t).filter(p => !p.sold).length : (t ? PUB.team_counts[t].nosales : PUB.nosales_count);

function niceMax(v){ const steps = [20,40,50,60,80,100,120,150,200,250,300,400,500,600,800,1000]; return steps.find(s => s >= v) || Math.ceil(v/500)*500; }
function renderChart(){
  $("#chart-h").textContent = TAB ? `${GNAME(TAB)} tickets per week` : `${CITY} tickets per week`;
  $("#chart-hint").textContent = (TAB === HOST ? `Host codes (${PUB.hosts.join(", ")})` : TAB ? `Codes on the Team ${TAB} sheet` : `All ${CITY} promoter codes`) + ", weeks running Monday to Monday. The outlined bar is this week so far.";
  const SHOW = 16;
  const start = Math.max(0, WEEKS.length - SHOW);
  const vals = TEAM.slice(start), labels = WEEKS.slice(start).map((_,j) => weekLabel(start + j));
  const max = niceMax(Math.max(...vals, 1));
  const ticks = [0, max/4, max/2, max*3/4, max];
  const curIdx = CUR - start;
  const partial = REF < WEEKS[CUR];
  const peak = vals.indexOf(Math.max(...vals));
  const y = ticks.map(t => `<span style="bottom:${t/max*100}%">${t}</span>`).join("");
  const g = ticks.slice(1).map(t => `<div class="gline" style="bottom:${t/max*100}%"></div>`).join("");
  const bars = vals.map((v,i) => {
    const isPart = partial && i === curIdx;
    const gi = start + i;
    const wl = LB.weeks[gi] ? LB.weeks[gi].label : weekLabel(gi);
    const tip = isPart ? `${wl} so far: ${v} tickets` : `${wl}: ${v} tickets`;
    const showVal = i === peak || i === vals.length-1 || (partial && i === curIdx-1);
    return `<div class="col${isPart?" partial":""}" tabindex="0" aria-label="${esc(tip)}">${showVal?`<span class="val">${v}</span>`:""}<div class="bar" style="height:${Math.max(v/max*100,1)}%"></div><span class="tip">${esc(tip)}</span></div>`;
  }).join("");
  $("#chart").innerHTML = `<div class="yaxis">${y}</div><div class="plot">${g}<div class="bars">${bars}</div></div>`;
  $("#xlabels").innerHTML = labels.map(l => `<span>${esc(l)}</span>`).join("");
}

/* ---------- filters ---------- */
function match(p, s){
  if (s.view === "sold" && !p.sold) return false;
  if (s.view === "none" && p.sold) return false;
  if (s.status !== "any" && p.s !== s.status) return false;
  if (s.contact === "phone" && !p.phone) return false;
  if (s.contact === "email" && !p.email) return false;
  if (s.contact === "ig" && !(p.ig && !p.phone && !p.email)) return false;
  if (s.contact === "nothing" && (!ROSTER || p.ig || p.phone || p.email)) return false;
  if (s.noteam && p.teams.length) return false;
  if (s.shared && p.teams.length < 2) return false;
  const o = (outreach[p.code] || {}).status || "";
  if (s.out === "not" && o) return false;
  if (s.out === "logged" && !o) return false;
  if (s.out === "followup" && o !== "followup") return false;
  if (s.out === "noreply" && o !== "noreply") return false;
  if (s.q){ const terms = s.q.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.every(t => p.hay.includes(t))) return false; }
  return true;
}
const CLV = {"Phone + email":0,"Phone only":1,"Email only":2,"Instagram only":3,"None":4};
function sorter(s){
  if (s.sort === "code") return (a,b) => a.code.localeCompare(b.code);
  if (s.sort === "recent") return (a,b) => (b.last_sale||"").localeCompare(a.last_sale||"") || b.tickets-a.tickets || a.code.localeCompare(b.code);
  if (s.sort === "contact") return (a,b) => (CLV[a.contact_level]??4)-(CLV[b.contact_level]??4) || b.tickets-a.tickets || a.code.localeCompare(b.code);
  return (a,b) => b.tickets-a.tickets || a.code.localeCompare(b.code);
}

const chev = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function spark(p){

        <ul class="tlist">${items}</ul>${extra}</article>`;
    }).join("");
    return `<div class="thead"><div class="ttl"><h2 id="todo-h">${esc(title)}</h2><div class="hint">Your weekly jobs from Lauren. Tick each one off as you go. A fresh list starts every Monday.</div></div>${weekNav()}</div>
      ${noteHTML()}
      <div class="tprog${left ? "" : " all"}" role="img" aria-label="${done} of ${N} done">
        <div class="tpn"><b>${done}</b><span>of ${N} done</span></div>${segHTML(tm)}
        <div class="tleft">${left ? `${left} still to do` : "All done this week"}</div></div>
      <div class="tdays">${cards}</div>
      <div class="tfn">Ticks and notes are saved in this browser only, so use the same phone or computer each time. Lauren can't see them here, so still send her your Friday summary.</div>`;
  }
  function overviewHTML(){
    const cards = TEAMS.map(t => {
      const tm = "t" + t, done = doneCount(tm);
      const next = DAYS.flatMap(d => d.items.filter(([i]) => !isDone(tm, i)).map(([, l]) => l))[0];
      const minis = DAYS.map(d => { const s = dayState(tm, d); return `<span class="tmini st-${s}" title="${esc(d.label)}: ${esc(stateLabel(d, s))}">${esc(d.short)}</span>`; }).join("");
      return `<button type="button" class="ttcard" data-team="${t}" aria-label="Open the Team ${t} to-do, ${done} of ${N} done">
        <div class="ttn">Team ${t}</div><div class="ttb">${done}<small>of ${N} done</small></div>${segHTML(tm)}
        <div class="tminis">${minis}</div>
        <div class="tnext">${next ? `Next: ${esc(next)}` : "All done this week"}</div></button>`;
    }).join("");
    return `<div class="thead"><div class="ttl"><h2 id="todo-h">Team lead to-do</h2><div class="hint">Each team lead ticks off their own list on their team's tab. Ticks are saved on this device. Tap a team to open it.</div></div>${weekNav()}</div>
      ${noteHTML()}<div class="tteams">${cards}</div>`;
  }

  /* ---------- render ---------- */
  function render_(){
    const el = $("#todo"); if (!el) return;
    if (MULTI && TAB === HOST){ el.hidden = true; return; }
    el.hidden = false;
    const ae = document.activeElement;
    if (ptrDown || (ae && el.contains(ae) && ae.tagName === "TEXTAREA")){ tPending = true; return; }
    tPending = false;
    if (!TW) TW = thisWeek();
    const html = MULTI && !TAB ? overviewHTML() : listHTML(teamKey());
    if (html !== lastHTML){
      const fid = ae && el.contains(ae) ? ae.id : "";
      el.innerHTML = html; lastHTML = html;
      if (fid){ const f = document.getElementById(fid); if (f) f.focus(); }
    }
  }
  /* ---------- data ---------- */
  function setWeek(wk){
    if (wk === TW) return;
    TW = wk; follow = wk === thisWeek();
    render_();
  }
  function write(k, body){
    const prev = TD[k];
    if (body) TD[k] = body; else delete TD[k];
    try { localStorage.setItem(K_TODO, JSON.stringify(TD)); return Promise.resolve(true); }
    catch {
      if (prev) TD[k] = prev; else delete TD[k];
      toast("Couldn't save on this device.");
      return Promise.resolve(false);
    }
  }
  async function tick(input){
    const k = input.dataset.doc, item = input.dataset.tick, on = input.checked;
    const [tm, wk] = k.split("_");
    const ok = await write(k, on ? {team: tm, week: wk, item, done: true, at: new Date().toISOString()} : null);
    if (!ok){ input.checked = !on; render_(); return; }
    render_();
    if (on && ITEMS.filter(i => i === item || isDone(tm, i)).length === N) toast("All " + N + " done this week. Nice work.");
  }
  async function saveField(ta){
    const k = ta.dataset.doc, item = ta.dataset.field, text = ta.value.trim();
    const r = TD[k], cur = (r && r.text) || "";
    if (text === cur){ delete tdrafts[k]; delete tsaving[k]; return; }
    const [tm, wk] = k.split("_");
    tsaving[k] = "saving";
    const ok = await write(k, text ? {team: tm, week: wk, item, text, at: new Date().toISOString()} : null);
    tsaving[k] = ok ? "" : "err";
    if (ok) delete tdrafts[k];
    render_();
  }

  /* ---------- events ---------- */
  const el = $("#todo");
  el.addEventListener("click", e => {
    const w = e.target.closest("[data-wk]");
    if (w){ const n = +w.dataset.wk; setWeek(n === 0 ? thisWeek() : addDays(TW, 7 * n)); return; }
    const t = e.target.closest("[data-team]");
    if (t && MULTI){ setTab(+t.dataset.team); return; }
    if (e.target.closest("[data-golist]")) document.querySelector(".roster").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  });
  el.addEventListener("change", e => {
    const c = e.target.closest("[data-tick]"); if (c){ tick(c); return; }
    const f = e.target.closest("[data-field]"); if (f) saveField(f);
  });
  el.addEventListener("input", e => { const f = e.target.closest("[data-field]"); if (f) tdrafts[f.dataset.doc] = f.value; });
  el.addEventListener("focusout", () => { setTimeout(() => { if (tPending) render_(); }, 0); });
  const up = () => { ptrDown = false; if (tPending) setTimeout(render_, 0); };
  document.addEventListener("pointerdown", () => { ptrDown = true; }, true);
  document.addEventListener("pointerup", up, true);
  document.addEventListener("pointercancel", up, true);
  // keep "Today" and "Overdue" right as the week goes on, and roll over to the new list on Monday
  setInterval(() => { if (follow && TW && TW !== thisWeek()) setWeek(thisWeek()); else render_(); }, 5 * 60e3);

  return {render: render_, start(){ if (!TW) TW = thisWeek(); render_(); }};
})();

/* ---------- boot ---------- */
compute(); syncControls(); render();
TODO.start();
loadLive();
})();
</script>

</body>
</html>
