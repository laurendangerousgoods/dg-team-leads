<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Sydney Team Lead Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: freight-manifest console — header band, figure strip, weekly chart + quick lists, then the roster as a filterable manifest of codes. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F7F8F9; --ink:#14161B; --ink-2:#434A57; --muted:#687080;
  --line:#E1E4E9; --grid:#ECEEF1; --accent:#D63A25; --accent-ink:#FFFFFF; --accent-soft:#FCE8E4;
  --good:#17714B; --good-bg:#E1F3EA; --warn:#8A5A00; --warn-bg:#FBEFD2; --quiet:#566070; --quiet-bg:#E9ECF0;
  --focus:#2563EB; --hazard:#F2B705; --shadow:0 1px 2px rgba(20,22,27,.06);
  --f-display:"Big Shoulders Display","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --ink-2:#C2C7D1; --muted:#9298A6;
  --line:#2A2F39; --grid:#232831; --accent:#FF6450; --accent-ink:#1B0906; --accent-soft:#3B1A14;
  --good:#63D29F; --good-bg:#11301F; --warn:#F0C14B; --warn-bg:#3A2D0C; --quiet:#AAB1BE; --quiet-bg:#262B34;
  --focus:#7EA8FF; --hazard:#F2B705; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --surface-2:#1C2027; --ink:#ECEEF2; --ink-2:#C2C7D1; --muted:#9298A6;
  --line:#2A2F39; --grid:#232831; --accent:#FF6450; --accent-ink:#1B0906; --accent-soft:#3B1A14;
  --good:#63D29F; --good-bg:#11301F; --warn:#F0C14B; --warn-bg:#3A2D0C; --quiet:#AAB1BE; --quiet-bg:#262B34;
  --focus:#7EA8FF; --hazard:#F2B705; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.placard{width:44px;height:44px;flex:none;transform:rotate(45deg);background:var(--hazard);border:2px solid var(--ink);display:grid;place-items:center;border-radius:3px}
.placard span{transform:rotate(-45deg);font:800 15px/1 var(--f-display);color:#14161B;letter-spacing:.02em}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(28px,4.2vw,40px)/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.fresh{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:440px}
.fresh b{font-weight:600;color:var(--ink)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.stat .value{font-size:24px}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;box-shadow:var(--shadow)}
.stat .label{font-size:12.5px;color:var(--ink-2)}
.stat .value{font:600 28px/1.1 var(--f-body)}
.stat .sub{font-size:12px;color:var(--muted)}

/* overview */
.overview{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.overview{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font:600 15px/1.3 var(--f-body)}
.panel .hint{font-size:12px;color:var(--muted);margin-top:2px}

.chartp{display:flex;flex-direction:column}
.chart{position:relative;margin-top:14px;flex:1;min-height:190px;display:grid;grid-template-columns:28px 1fr;gap:6px}
.yaxis{position:relative;font-size:11px;color:var(--muted)}
.yaxis span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;border-bottom:1px solid var(--line)}
.gline{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;outline:none;cursor:default}
.bar{width:100%;max-width:24px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.col.partial .bar{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.col .val{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:3px}
.col .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3}
.col:hover .tip,.col:focus-visible .tip{opacity:1}
.col:nth-last-child(-n+4) .tip{left:auto;right:0;transform:none}
.col:nth-child(-n+2) .tip{left:0;transform:none}
.col:hover .bar,.col:focus-visible .bar{filter:brightness(1.12)}
.xlabels{display:flex;gap:2px;margin-left:34px;margin-top:6px}
.xlabels span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:visible}
@media (max-width:620px){.xlabels span:not(:nth-child(3n+1)){visibility:hidden}}

.quick{display:grid;gap:8px;margin-top:12px}
.qbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.qbtn:hover{border-color:var(--ink-2)}
.qbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.qbtn .qt{font-weight:600;font-size:13.5px}
.qbtn .qd{font-size:12px;color:var(--muted)}
.qbtn .qn{font:600 18px/1 var(--f-body);font-variant-numeric:tabular-nums}

/* roster toolbar */
.roster{display:grid;gap:10px}
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{display:grid;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;min-width:0;text-transform:none;letter-spacing:0;color:var(--ink)}
.filters input[type=search]{width:min(260px,100%)}
.showing{font-size:12.5px;color:var(--muted)}
.clear{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px 0;font-size:12.5px}

/* rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.row,.lhead{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.05fr) minmax(0,1.7fr) minmax(0,1.35fr) 34px;gap:14px;align-items:start;padding:12px 14px}
.lhead{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-block:9px}
.row{border-bottom:1px solid var(--line)}
.item:last-child .row{border-bottom:0}
.item.open .row{background:var(--surface-2)}
.code{font:700 13.5px/1.2 var(--f-mono);letter-spacing:.02em;word-break:break-all}
.nm{font-size:13px;color:var(--ink-2);margin-top:2px}
.nm.none{color:var(--muted);font-style:italic}
.ig{font-size:12.5px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);word-break:break-all}
.ig:hover{color:var(--accent);border-color:var(--accent)}
.flag{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 6px}
.tix{display:flex;align-items:center;gap:10px}
.tix .num{font:600 20px/1 var(--f-body);font-variant-numeric:tabular-nums;min-width:2ch}
.tix .num.zero{color:var(--muted);font-weight:500}
.tix .rk{font-size:11.5px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:1px;height:20px;width:66px}
.spark i{flex:1;background:var(--accent);border-radius:1.5px 1.5px 0 0;min-height:1px;opacity:.9}
.spark i.z{background:var(--line);opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-active{color:var(--good);background:var(--good-bg)}
.s-slowing{color:var(--warn);background:var(--warn-bg)}
.s-quiet{color:var(--quiet);background:var(--quiet-bg)}
.s-none{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.s-none::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.when{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.contact{display:grid;gap:5px;min-width:0}
.cline{display:flex;align-items:center;gap:6px;min-width:0}
.cline .v{font-size:13px;min-width:0;overflow-wrap:anywhere;user-select:all}
.cline .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:40px;flex:none}
.copy{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11.5px;padding:2px 7px;cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--ink-2);color:var(--ink)}
.nocontact{font-size:12.5px;color:var(--muted)}
.out{display:grid;gap:5px;min-width:0}
.out select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px}
.out select.set{border-color:var(--ink-2);font-weight:600}
.out .by{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.out .note-ex{font-size:12px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.more svg{transition:transform .15s}
.item.open .more svg{transform:rotate(180deg)}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;padding:4px 14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.detail h3{font:600 12px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.wk{display:flex;align-items:flex-end;gap:2px;height:60px;border-bottom:1px solid var(--line)}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.wk b{width:100%;max-width:16px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.wk b.z{background:transparent}
.wk .partial b{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.wk em{font-style:normal;font-size:10px;color:var(--ink-2);font-weight:600}
.wkx{display:flex;gap:2px;margin-top:4px}
.wkx span{flex:1;text-align:center;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-top:12px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere;color:var(--ink-2)}
.notes-list{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--warn)}
.note-box{display:grid;gap:6px}
.note-box textarea{width:100%;min-height:74px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:7px;padding:7px 14px;cursor:pointer;justify-self:start}
.btn:disabled{opacity:.5;cursor:default}
.ro{font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .lhead{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who more" "tix tix" "st st" "ct ct" "out out";gap:10px}
  .row>.c-who{grid-area:who}.row>.c-tix{grid-area:tix}.row>.c-st{grid-area:st}.row>.c-ct{grid-area:ct}.row>.c-out{grid-area:out}.row>.c-more{grid-area:more}
  .c-st{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.c-st .when{margin-top:0}
  .nosale .c-tix{display:none}
}

/* checks */
.checks ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.checks .code{font-size:12.5px}
.foot{font-size:12px;color:var(--muted);display:grid;gap:4px;max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;z-index:10;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.lock{display:grid;gap:10px}
.lk-row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lk-row>div:first-child{flex:1 1 320px;min-width:0}
.lock h2{font-size:16px}
.lk-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lk-form input[type=password]{min-width:0;width:260px;max-width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-mono)}
.lk-form .rem{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lk-msg{color:var(--accent);font-weight:600;font-size:13px}
.lock.open{border-left:4px solid var(--good)}
.lock:not(.open){border-left:4px solid var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qbtn[disabled]{opacity:.55;cursor:not-allowed}
select:disabled{opacity:.55}
@media (max-width:620px){.lk-form{width:100%}.lk-form input[type=password]{flex:1 1 100%;width:100%}}
</style>
<style>:root{--accent:#D63A25;--accent-soft:#FCE8E4}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#FF6450;--accent-soft:#3B1A14;--accent-ink:#1B0906}}:root[data-theme="dark"]{--accent:#FF6450;--accent-soft:#3B1A14;--accent-ink:#1B0906}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="placard" aria-hidden="true"><span>DG</span></div>
      <div>
        <div class="eyebrow">Dangerous Goods XXL 2027 · Sydney team leads</div>
        <h1>Sydney Promoter Dashboard</h1>
      </div>
    </div>
    <div class="fresh" id="fresh"></div>
  </header>

  <section class="panel lock" id="lock" aria-label="Contact details"></section>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <section class="overview">
    <div class="panel chartp">
      <h2>Team tickets per week</h2>
      <div class="hint">All Sydney promoter codes, weeks running Monday to Monday. The outlined bar is this week so far.</div>
      <div class="chart" id="chart"></div>
      <div class="xlabels" id="xlabels"></div>
    </div>
    <div class="panel">
      <h2>Who to contact</h2>
      <div class="hint">Shortcuts that filter the list below.</div>
      <div class="quick" id="quick"></div>
    </div>
  </section>

  <section class="roster" aria-label="Promoters">
    <div class="rhead">
      <div class="seg" role="group" aria-label="Sales" id="seg"></div>
      <div class="showing" id="showing"></div>
    </div>
    <div class="filters">
      <label>Search<input type="search" id="q" placeholder="Code, name, Instagram, phone"></label>
      <label>Sales status<select id="f-status">
        <option value="any">Any</option><option value="active">Active (last 3 wks)</option>
        <option value="slowing">Slowing (3–6 wks)</option><option value="quiet">Gone quiet (6+ wks)</option>
        <option value="none">No sales yet</option></select></label>
      <label>Contact details<select id="f-contact">
        <option value="any">Any</option><option value="phone">Has phone number</option>
        <option value="email">Has email</option><option value="ig">Instagram only</option>
        <option value="nothing">Nothing on file</option></select></label>
      <label>Outreach<select id="f-out">
        <option value="any">Any</option><option value="not">Not contacted yet</option>
        <option value="logged">Contacted (any)</option><option value="followup">Needs follow up</option>
        <option value="noreply">No reply</option></select></label>
      <label>Sort<select id="f-sort">
        <option value="tickets">Most tickets</option><option value="recent">Most recent sale</option>
        <option value="contact">Best contact details</option><option value="code">Code A–Z</option></select></label>
      <button class="clear" id="clear" type="button">Reset filters</button>
    </div>
    <div class="list" id="list" role="list"></div>
  </section>

  <section class="panel checks" id="checks" hidden></section>

  <footer class="foot" id="foot"></footer>

<script>
(function(){
const PUB = JSON.parse(document.getElementById("pub").textContent);
const LOCKED = JSON.parse(document.getElementById("locked").textContent);
const CITY = PUB.city, KEY = PUB.city_key;
const SLABEL = {active:"Active",slowing:"Slowing",quiet:"Gone quiet",none:"No sales yet"};
const STIP = {active:"Sold in the last 3 weeks",slowing:"Last sale 3–6 weeks ago",quiet:"No sale in 6+ weeks",none:"Code not on the sales leaderboard yet"};
const OUT = [["","Not contacted"],["messaged","Messaged"],["spoke","Spoke to them"],["noreply","No reply"],["followup","Follow up"],["notint","Not interested"]];
const OUTL = Object.fromEntries(OUT);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const dshort = s => { const d = pd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const dlong = s => { const d = pd(s); return `${DAY[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const daysBetween = (a,b) => Math.round((pd(b) - pd(a)) / 86400000);
const IGOK = h => /^[A-Za-z0-9._]{1,30}$/.test(h);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
const K_PASS = "dgtl-pass-" + KEY, K_OUT = "dgtl-out-" + KEY;

/* ---------- sales: the leaderboard's own data, read live from the same site ---------- */
function slim(d){
  return {
    generated: d.generated || "", today: d.today, alias: d.alias || {},
    weeks: (d.weeks || []).map(w => ({key:w.key, end:w.end, label:w.label})),
    promoters: (d.promoters || []).map(p => {
      const last = (p.sales || []).reduce((m,s) => (s[0] > m ? s[0] : m), "").slice(0,10);
      const cum = p.cum || []; const total = cum.length ? cum[cum.length-1] : (p.weekly||[]).reduce((a,b)=>a+b,0);
      return {code:p.code, weekly:p.weekly || [], total, last: last || p.last || ""};
    }),
  };
}
let LB = PUB.snapshot, lbLive = false;
async function loadLive(){
  try {
    const r = await fetch(PUB.lb_path, {cache:"no-store"});
    if (!r.ok) throw new Error("status " + r.status);
    const html = await r.text();
    const m = html.match(/<script id="pc-data" type="application\/json">([\s\S]*?)<\/script>/);
    if (!m) throw new Error("no data");
    LB = slim(JSON.parse(m[1])); lbLive = true;
  } catch (e) { lbLive = false; }
  compute(); render();
}

/* ---------- contacts: encrypted, opened with the team lead passcode ---------- */
let ROSTER = null, unlocking = false, lockMsg = "";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, "-");
async function openRoster(pass){
  if (!(window.crypto && crypto.subtle)) throw new Error("nocrypto");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pass)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(LOCKED.salt), iterations:LOCKED.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(LOCKED.iv)}, key, b64(LOCKED.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pass, remember, quiet){
  unlocking = true; lockMsg = ""; renderLock();
  try {
    ROSTER = await openRoster(pass);
    if (remember) store.set(K_PASS, norm(pass)); else store.del(K_PASS);
    lockMsg = ""; if (!quiet) toast("Contact details unlocked");
    Object.assign(st, blank(), {view:"sold"}); syncControls();
  } catch (e) {
    ROSTER = null;
    if (quiet) store.del(K_PASS);
    else lockMsg = e && e.message === "nocrypto" ? "This browser can't unlock the page. Open the link in Chrome or Safari." : "That passcode didn't work. Check it and try again.";
  }
  unlocking = false; compute(); render();
}
function lockAgain(){ ROSTER = null; store.del(K_PASS); Object.assign(st, blank(), {view:"sold"}); syncControls(); compute(); render(); toast("Locked"); }

/* ---------- outreach log: kept in this browser only ---------- */

try { outreach = JSON.parse(store.get(K_OUT) || "{}") || {}; } catch { outreach = {}; }
function save(code, patch){
  const cur = outreach[code] || {};
  const body = {status: patch.status ?? cur.status ?? "", note: patch.note ?? cur.note ?? "", at: new Date().toISOString()};
  if (!body.status && !body.note) delete outreach[code]; else outreach[code] = body;
  store.set(K_OUT, JSON.stringify(outreach));
  if ("note" in patch){ delete drafts[code]; toast("Note saved for " + code); }
  else toast(body.status ? `${code}: ${OUTL[body.status]}` : `${code}: cleared`);
  render();
}

/* ---------- merge ---------- */
let P = [], sold = [], nos = [], WEEKS = [], TEAM = [], REF = "", CUR = 0, LASTW = -1;
const open = new Set(), drafts = {};
let pendingRender = false;
const EMPTY = {name:"", ig:"", phone:"", email:"", contact_level:"None", contact_source:"", in_codes_sheet:true, notes:[]};
function compute(){
  REF = LB.today;
  WEEKS = LB.weeks.map(w => w.key);
  CUR = WEEKS.findIndex(k => k >= REF); if (CUR < 0) CUR = WEEKS.length - 1;
  LASTW = CUR - 1;
  const byCode = {};
  LB.promoters.forEach(x => {
    byCode[x.code] = Object.assign({}, EMPTY, {code:x.code, weekly:WEEKS.map((_,i) => +x.weekly[i] || 0), tickets:+x.total || 0,
      last_sale:x.last, last_week: LASTW >= 0 ? (+x.weekly[LASTW] || 0) : 0, since_mon: +x.weekly[CUR] || 0, known:false});
  });
  if (ROSTER){
    const owned = new Set(ROSTER.map(r => r.code));
    ROSTER.forEach(r => {
      const al = LB.alias && LB.alias[r.code];
      const code = al && !owned.has(al) ? al : r.code;   // borrow the leaderboard code only if no other record owns it
      const b = byCode[code];
      const c = {name:r.name||"", ig:r.ig||"", phone:r.phone||"", email:r.email||"", contact_level:r.contact_level||"None",
                 contact_source:r.contact_source||"", in_codes_sheet:!!r.in_codes_sheet, notes:(r.notes||[]).slice(), known:true};
      if (al) c.notes.push(`Sales for ${r.code} are counted under ${al} on the leaderboard`);
      if (b) Object.assign(b, c);
      else byCode[r.code] = Object.assign({code:r.code, weekly:WEEKS.map(()=>0), tickets:0, last_sale:"", last_week:0, since_mon:0}, c);
    });
    Object.values(byCode).forEach(p => { if (!p.known){ p.in_codes_sheet = false; p.notes = [`On the sales leaderboard but NOT in the ${PUB.codes_sheet} sheet, so no contact details on file`]; } });
  }
  P = Object.values(byCode).map(p => {
    p.link = PUB.link_base + p.code;
    p.sold = p.tickets > 0;
    if (!p.sold) p.last_sale = "";
    const gap = p.last_sale ? daysBetween(p.last_sale, REF) : null;
    p.s = !p.sold ? "none" : gap <= 21 ? "active" : gap <= 42 ? "slowing" : "quiet";
    p.shownNotes = (p.notes||[]).filter(n => !/^Listed \d+x/.test(n) && !(p.sold && /not on the dashboard/.test(n)));
    p.hay = [p.code,p.name,p.ig,(p.phone||"").replace(/\s/g,""),p.phone,p.email].join(" ").toLowerCase();
    return p;
  });
  const ranked = P.filter(p => p.sold).map(p => p.tickets);
  P.forEach(p => { p.rank = p.sold ? 1 + ranked.filter(t => t > p.tickets).length : null; });
  sold = P.filter(p => p.sold); nos = P.filter(p => !p.sold);
  TEAM = WEEKS.map((_,i) => sold.reduce((a,p) => a + p.weekly[i], 0));
}

function niceMax(v){ const steps = [20,40,50,60,80,100,120,150,200,250,300,400,500,600,800,1000]; return steps.find(s => s >= v) || Math.ceil(v/500)*500; }
function renderChart(){

  const vals = TEAM.slice(start), labels = WEEKS.slice(start).map((_,j) => weekLabel(start + j));
  const max = niceMax(Math.max(...vals, 1));
  const ticks = [0, max/4, max/2, max*3/4, max];
  const curIdx = CUR - start;

  const bars = vals.map((v,i) => {

    const tip = isPart ? `${wl} so far: ${v} tickets` : `${wl}: ${v} tickets`;
    const showVal = i === peak || i === vals.length-1 || (partial && i === curIdx-1);

/* ---------- filters ---------- */
function match(p, s){
  if (s.view === "sold" && !p.sold) return false;
  if (s.view === "none" && p.sold) return false;
  if (s.status !== "any" && p.s !== s.status) return false;
  if (s.contact === "phone" && !p.phone) return false;
  if (s.contact === "email" && !p.email) return false;
  if (s.contact === "ig" && !(p.ig && !p.phone && !p.email)) return false;
  if (s.contact === "nothing" && (!ROSTER || p.ig || p.phone || p.email)) return false;
  const o = (outreach[p.code] || {}).status || "";
  if (s.out === "not" && o) return false;
  if (s.out === "logged" && !o) return false;
  if (s.out === "followup" && o !== "followup") return false;
  if (s.out === "noreply" && o !== "noreply") return false;
  if (s.q){ const terms = s.q.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.every(t => p.hay.includes(t))) return false; }
  return true;
}
const CLV = {"Phone + email":0,"Phone only":1,"Email only":2,"Instagram only":3,"None":4};
function sorter(s){
  if (s.sort === "code") return (a,b) => a.code.localeCompare(b.code);
  if (s.sort === "recent") return (a,b) => (b.last_sale||"").localeCompare(a.last_sale||"") || b.tickets-a.tickets || a.code.localeCompare(b.code);
  if (s.sort === "contact") return (a,b) => (CLV[a.contact_level]??4)-(CLV[b.contact_level]??4) || b.tickets-a.tickets || a.code.localeCompare(b.code);
  return (a,b) => b.tickets-a.tickets || a.code.localeCompare(b.code);
}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200); }
$("#list").addEventListener("click", async e => {
  const c = e.target.closest("[data-copy]");
  if (c){
    const v = c.dataset.copy;
    try { await navigator.clipboard.writeText(v); toast("Copied " + v); }
    catch { const el = c.previousElementSibling; if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Selected. Press Ctrl+C or Cmd+C to copy."); }
    return;
  }
  const m = e.target.closest("[data-more]");
  if (m){ const code = m.dataset.more; open.has(code) ? open.delete(code) : open.add(code); render(); return; }
  if (e.target.closest("[data-reset]")){ Object.assign(st, blank(), {view: st.view}); syncControls(); render(); return; }
  const s = e.target.closest("[data-save]");
  if (s){ const code = s.dataset.save; const ta = document.getElementById("n-" + code); save(code, {note: (ta ? ta.value : "").trim()}); }
});
$("#list").addEventListener("change", e => {
  const sel = e.target.closest("[data-out]"); if (!sel) return;
  sel.blur(); save(sel.dataset.out, {status: sel.value});
});
$("#list").addEventListener("input", e => { const ta = e.target.closest("[data-note]"); if (ta) drafts[ta.dataset.note] = ta.value; });

$("#foot").innerHTML = `<div><b>Made sales</b> means the code is on the ${esc(CITY)} promoter sales leaderboard. <b>Active</b> = sold in the last 3 weeks, <b>Slowing</b> = last sale 3 to 6 weeks ago, <b>Gone quiet</b> = no sale in 6+ weeks. Weeks run Monday to Monday.</div>
<div>Sales come straight from the leaderboard each time the page opens, so they update whenever it does. Contact details come from the ${esc(PUB.codes_sheet)} sheet (saved ${esc(PUB.built)}), with gaps filled from other ${esc(CITY)} promoter lists. Outreach and notes are saved in this browser only.</div>`;

/* ---------- boot ---------- */
compute(); syncControls(); render();
const saved = store.get(K_PASS);
if (saved) unlock(saved, true, true);
loadLive();
})();
</script>
